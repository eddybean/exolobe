name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS ランナーが必須。テストは実際の /usr/bin/afconvert を通してエンコードを
    # 検証しており、postinstall も PlistBuddy と codesign を使う。
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx electron-vite build
