name: CI

on:
  # ビルドにも実行にも影響しないファイルだけの変更では CI を回さない。
  # paths-ignore に .github/workflows/** を足してはいけない
  # （ワークフロー自体の変更は必ず検証する）。
  # GitHub Actions は YAML のアンカー／エイリアスを解釈しないため、
  # push と pull_request で同じ一覧を二重に書く必要がある。
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/build-whisper.sh が取得する whisper.cpp のバージョン。release.yml と揃える。
  WHISPER_VERSION: v1.9.4

jobs:
  test:
    # macOS ランナーが必須。テストは実際の /usr/bin/afconvert を通してエンコードを
    # 検証しており、postinstall も PlistBuddy と codesign を使う。
    # xcode-27 なのは、Apple のモデルでの要約（FoundationModels）に macOS 27 SDK が要るため。
    # 同梱バイナリの最低対応 OS は build-*.sh が指定するので、ランナーの OS には引きずられない。
    # release.yml と揃える（キャッシュしたバイナリを Release が読むため）。
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm の tarball キャッシュ（setup-node の cache: npm）では、postinstall が
      # 落とす Electron 本体や node-llama-cpp のバイナリは毎回取り直しになり、
      # npm ci が CI の半分以上を占めていた。node_modules ごと保存し、lockfile が
      # 変わらない限り npm ci を飛ばす。postinstall でパッチ済みの Electron.app も
      # そのまま入っている。キーを変えるときは release.yml と揃える。
      - name: node_modules のキャッシュを復元
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}

      - name: 依存関係をインストール
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 整形の確認
        run: npm run fmt:check

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx electron-vite build

      # Release はタグ上で走るが、タグの実行から読めるキャッシュは「そのタグ自身」と
      # 既定ブランチのものだけで、前のタグが保存した分は見えない。main への push で
      # whisper-cli のキャッシュを作っておき、Release がそれを引けるようにする。
      # キーは release.yml と揃えること（ずれると Release が毎回ビルドし直す）。
      - name: whisper-cli のキャッシュを復元（Release 用）
        if: github.event_name == 'push'
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/bin/whisper-cli
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_VERSION }}-${{ hashFiles('scripts/build-whisper.sh', 'scripts/min-macos.sh') }}

      - name: whisper-cli をビルド（Release 用）
        if: github.event_name == 'push' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: npm run build:whisper

      # 最低対応 OS を上げずにキャッシュへ載ったものが Release まで残らないよう、ここで止める。
      - name: whisper-cli の最低対応 OS を確認（Release 用）
        if: github.event_name == 'push'
        run: bash scripts/check-min-macos.sh resources/bin/whisper-cli
