name: CI

on:
  # ビルドにも実行にも影響しないファイルだけの変更では CI を回さない。
  # paths-ignore に .github/workflows/** を足してはいけない
  # （ワークフロー自体の変更は必ず検証する）。
  # GitHub Actions は YAML のアンカー／エイリアスを解釈しないため、
  # push と pull_request で同じ一覧を二重に書く必要がある。
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/build-whisper.sh が取得する whisper.cpp のバージョン。release.yml と揃える。
  WHISPER_VERSION: v1.9.4
  # Windows の whisper-cli のビルドに使う Vulkan SDK（LunarG）の版。
  VULKAN_SDK_VERSION: 1.4.363.0

jobs:
  # 版上げ（bump-version.yml の PR）は package.json と package-lock.json の版しか変えず、中身は main と同じ。
  # PR でもマージ後の main でも、macOS と Windows のランナーで確かめ直さない（Release のビルドも
  # 型チェックとテストを回す）。whisper-cli のキャッシュのキーは版に左右されないので作り直す必要もない。
  # Actions が作った PR の CI は承認待ち（action_required）で止まるが、承認すればここで飛ぶ。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'

      # push は直前の main と、PR は向き先と比べる。PR の checkout はマージ後の姿なので、向き先が
      # 進んでいればその変更も差分に入り、CI を回す側に倒れる。
      - name: 版だけの変更かを確かめる
        id: check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 迷ったら CI を回す。新しいブランチの push（before が 0）や、比べる元が取れないときも回す。
          if { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; } &&
            [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
            git fetch --quiet --no-tags --depth=1 origin "$BASE" &&
            [ "$(node scripts/version-bump.mjs only-version "$BASE")" = true ]; then
            echo "::notice::版だけの変更なので、テストとビルドを飛ばします。"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS ランナーが必須。テストは実際の /usr/bin/afconvert を通してエンコードを
    # 検証しており、postinstall も PlistBuddy と codesign を使う。
    # xcode-27 なのは、Apple のモデルでの要約（FoundationModels）に macOS 27 SDK が要るため。
    # 同梱バイナリの最低対応 OS は build-*.sh が指定するので、ランナーの OS には引きずられない。
    # release.yml と揃える（キャッシュしたバイナリを Release が読むため）。
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm の tarball キャッシュ（setup-node の cache: npm）では、postinstall が
      # 落とす Electron 本体や node-llama-cpp のバイナリは毎回取り直しになり、
      # npm ci が CI の半分以上を占めていた。node_modules ごと保存し、lockfile が
      # 変わらない限り npm ci を飛ばす。postinstall でパッチ済みの Electron.app も
      # そのまま入っている。キーを変えるときは release.yml と揃える。
      # キーは lockfile から版を除いた中身で作る。版上げのたびにキャッシュを外さないため（scripts/version-bump.mjs）。
      - name: 依存のキーを求める
        id: deps
        shell: bash
        run: node scripts/version-bump.mjs key >> "$GITHUB_OUTPUT"

      - name: node_modules のキャッシュを復元
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.deps.outputs.key }}

      - name: 依存関係をインストール
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 整形の確認
        run: npm run fmt:check

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx electron-vite build

      # Release はタグ上で走るが、タグの実行から読めるキャッシュは「そのタグ自身」と
      # 既定ブランチのものだけで、前のタグが保存した分は見えない。main への push で
      # whisper-cli のキャッシュを作っておき、Release がそれを引けるようにする。
      # キーは release.yml と揃えること（ずれると Release が毎回ビルドし直す）。
      - name: whisper-cli のキャッシュを復元（Release 用）
        if: github.event_name == 'push'
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/bin/whisper-cli
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_VERSION }}-${{ hashFiles('scripts/build-whisper.sh', 'scripts/min-macos.sh') }}

      - name: whisper-cli をビルド（Release 用）
        if: github.event_name == 'push' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: npm run build:whisper

      # 最低対応 OS を上げずにキャッシュへ載ったものが Release まで残らないよう、ここで止める。
      - name: whisper-cli の最低対応 OS を確認（Release 用）
        if: github.event_name == 'push'
        run: bash scripts/check-min-macos.sh resources/bin/whisper-cli

  # Windows 版に向けて、OS に依存しない部分が Windows でも壊れていないことを確かめる（ADR-048）。
  # macOS のコマンドを実際に呼ぶテストは tests/platform.ts の notMacOS で飛ばしている。
  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # キーに runner.os を含むので、macOS の node_modules とは混ざらない。
      # キーは lockfile から版を除いた中身で作る。版上げのたびにキャッシュを外さないため（scripts/version-bump.mjs）。
      - name: 依存のキーを求める
        id: deps
        shell: bash
        run: node scripts/version-bump.mjs key >> "$GITHUB_OUTPUT"

      - name: node_modules のキャッシュを復元
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.deps.outputs.key }}

      - name: 依存関係をインストール
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 整形の確認
        run: npm run fmt:check

      # 補助プログラム（Rust）。ランナーに rustup と cargo が入っている。テストより先に作り、
      # audioconv の実物を通すテスト（Media Foundation）も走らせる。syscapture の取り込みは
      # 音声デバイスが要るので CI では走らせない（tests/manual）。
      - name: 補助プログラムのビルド
        run: |
          npm run build:syscapture
          npm run build:audioconv
          npm run build:micwatch

      # 補助プログラムの純粋な判定（自分のプロセスの木の除外など）の Rust のテスト。
      # crate のディレクトリで走らせる（.cargo/config.toml の設定をビルドと揃える）。
      - name: 補助プログラムのテスト
        working-directory: native/micwatch
        run: cargo test --release --locked

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx electron-vite build

      # macOS と同じく main への push で whisper-cli（Vulkan と CPU、ADR-048）のキャッシュを作り、Release が引く。
      # バックエンドを DLL に分けているので、whisper-cli.exe と DLL（ランタイムを含む）をまとめて運ぶ。
      # キーに runner.os を含むので macOS のものとは混ざらない。release.yml の Windows のジョブとキーを揃えること。
      - name: whisper-cli のキャッシュを復元（Release 用）
        if: github.event_name == 'push'
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/bin/whisper-cli.exe
            resources/bin/whisper.dll
            resources/bin/ggml*.dll
            resources/bin/msvcp140.dll
            resources/bin/vcruntime140*.dll
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_VERSION }}-${{ hashFiles('scripts/build-whisper.mjs') }}

      # Vulkan のシェーダを組み込むのに要る（ビルドのときだけ。利用者の機体には GPU ドライバの vulkan-1.dll があればよい）。
      - name: Vulkan SDK を入れる（Release 用）
        if: github.event_name == 'push' && steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:/VulkanSDK/$env:VULKAN_SDK_VERSION"
          Add-Content $env:GITHUB_PATH "C:/VulkanSDK/$env:VULKAN_SDK_VERSION/Bin"

      - name: whisper-cli をビルド（Release 用）
        if: github.event_name == 'push' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: npm run build:whisper
