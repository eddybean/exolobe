name: CI

on:
  # ビルドにも実行にも影響しないファイルだけの変更では CI を回さない。
  # paths-ignore に .github/workflows/** を足してはいけない
  # （ワークフロー自体の変更は必ず検証する）。
  # GitHub Actions は YAML のアンカー／エイリアスを解釈しないため、
  # push と pull_request で同じ一覧を二重に書く必要がある。
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS ランナーが必須。テストは実際の /usr/bin/afconvert を通してエンコードを
    # 検証しており、postinstall も PlistBuddy と codesign を使う。
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx electron-vite build
