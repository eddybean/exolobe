appId: com.branch.duoscribe

# productName は必ず ASCII にする。日本語にすると、生成されたアプリが起動直後に
# SIGTRAP で落ちる（実行ファイル名・ヘルパーアプリ名・フレームワーク参照がすべて
# この名前から作られるため）。Duoscribe は ASCII なので、表示名を別に持たず
# Finder もメニューバーもこの名前をそのまま出す（ADR-013）。
productName: Duoscribe

artifactName: ${name}-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release

# 証明書が無い環境では ad-hoc 署名にフォールバックする。
# Core Audio Process Tap の権限は署名済みバイナリでしか有効にならないため。
afterPack: build/after-pack.cjs

files:
  - out/**
  - package.json
  - '!**/*.map'

# whisper-cli は whisper.cpp が macOS 版 CLI を配布していないため、
# scripts/build-whisper.sh でビルドしたものをここから同梱する。
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

# ネイティブモジュールは asar の中からは読み込めないため展開して置く。
asarUnpack:
  - '**/node_modules/node-llama-cpp/**'
  - '**/node_modules/@node-llama-cpp/**'
  - '**/node_modules/sherpa-onnx*/**'
  - '**/node_modules/audiotee/**'

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Core Audio Process Tap の権限。署名済みバイナリでのみ有効になる。
    NSAudioCaptureUsageDescription: 会議相手の音声を録音するためにシステム音声を取得します。
    NSMicrophoneUsageDescription: 会議中のあなたの発言を録音するためにマイクを使用します。
    LSMinimumSystemVersion: '14.2'

dmg:
  title: ${productName}
  # ad-hoc 署名の配布物は Gatekeeper に隔離されるため、解除手順を dmg に同梱する。
  # Release の説明文にも同じ案内があるが、dmg を直接受け取った人には届かない。
  # contents を指定すると既定のレイアウトを上書きするので、アプリと
  # /Applications へのリンクも既定と同じ座標で並べ直す必要がある。
  # 既定の背景画像は 540x380 固定でウィンドウを広げると破綻するため、
  # サイズは変えず、矢印の下の空き領域にテキストを置いている。
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 335
      type: file
      path: build/dmg/はじめにお読みください.txt
