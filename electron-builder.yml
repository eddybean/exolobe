# bundle ID は自分が管理するドメインを逆さにする慣習に従い、GitHub Pages の
# eddybean.github.io から作る。変えると macOS は別アプリとみなし、マイク・システム音声・
# カレンダーの許可を取り直させる（userData は productName 由来なので動かない）。
appId: io.github.eddybean.exolobe

# productName は必ず ASCII にする。日本語にすると、生成されたアプリが起動直後に
# SIGTRAP で落ちる（実行ファイル名・ヘルパーアプリ名・フレームワーク参照がすべて
# この名前から作られるため）。Exolobe は ASCII なので、表示名を別に持たず
# Finder もメニューバーもこの名前をそのまま出す（ADR-013）。
productName: Exolobe

artifactName: ${name}-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release

# 証明書が無い環境では ad-hoc 署名にフォールバックする。
# Core Audio Process Tap の権限は署名済みバイナリでしか有効にならないため。
afterPack: build/after-pack.cjs

files:
  - out/**
  - package.json
  - '!**/*.map'
  # node-llama-cpp の CUDA 版（win-x64-cuda / -cuda-ext、合わせて約 530MB）は同梱しない（ADR-048）。
  # Vulkan なら NVIDIA・AMD・Intel のどれでも動く。getLlama にも CUDA を除くよう指定している。
  # Windows は x64 だけを配るので、Arm 版も入れない。
  - '!**/node_modules/@node-llama-cpp/win-x64-cuda*/**'
  - '!**/node_modules/@node-llama-cpp/win-arm64*/**'

# 同梱バイナリは OS ごとに分け、互いの配布物に混ぜない（ADR-048）。resources/bin は
# ビルドした機械の OS のものしか作られないが、別 OS の成果物が紛れても入らないよう拡張子で絞る。

# Electron が持ち込む数十言語の .lproj を、対応している言語だけに絞る。macOS は .lproj の
# 有無でアプリの言語を選ぶので、残したままだと例えばドイツ語の人に「ドイツ語のアプリ」と
# 判定され、Electron のメニュー（編集・ウィンドウ）だけがドイツ語になる。
# Windows では同じ設定が locales/*.pak を絞る。英語の .pak は en-US という名前なので並べておく
# （Chromium が最後に頼る言語で、消すと起動できない）。Windows の配布物ではまだ確かめていない。
electronLanguages:
  - en
  - en-US
  - ja

# ネイティブモジュールは asar の中からは読み込めないため展開して置く。
asarUnpack:
  - '**/node_modules/node-llama-cpp/**'
  - '**/node_modules/@node-llama-cpp/**'
  - '**/node_modules/sherpa-onnx*/**'
  - '**/node_modules/audiotee/**'

mac:
  category: public.app-category.productivity
  # whisper-cli は whisper.cpp が macOS 版 CLI を配布していないため、
  # scripts/build-whisper.sh でビルドしたものをここから同梱する。
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - '**/*'
        - '!**/*.exe'
        - '!**/*.dll'
    # 許可ダイアログの文言を UI の言語で出す（ADR-043）。Contents/Resources/<言語>.lproj に置く。
    - from: build/lproj
      to: .
      filter:
        - '**/*.strings'
  # scripts/build-icon.mjs が生成する。同じ寸法定義からメニューバー用の
  # アイコン（src/main/trayIcon.ts）も出しているので、意匠を変えるなら両方作り直す。
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # 対応していない言語の人に出す言語。UI の言語を決める規則（優先言語に無ければ英語）と揃える。
    CFBundleDevelopmentRegion: en
    # 許可の説明文。ここは基底（英語）で、言語ごとの文言は build/lproj の InfoPlist.strings に置く
    # （ADR-043）。tests/scripts/info-plist-strings.test.ts が英語版との一致を確かめる。
    # Core Audio Process Tap の権限。署名済みバイナリでのみ有効になる。
    NSAudioCaptureUsageDescription: Exolobe captures system audio to record what the other participants say in your meetings.
    NSMicrophoneUsageDescription: Exolobe uses the microphone to record what you say in your meetings.
    # カレンダー連携（ADR-040）。同梱の calendarevents の問い合わせもアプリに帰属する。
    # macOS 14 以降は FullAccess のキーを見る（旧 NSCalendarsUsageDescription は 14 未満向けで不要）。
    NSCalendarsFullAccessUsageDescription: Exolobe reads your calendar to fill in the title and participant names from the event that overlaps when a recording starts.
    LSMinimumSystemVersion: '14.2'

dmg:
  title: ${productName}
  # ad-hoc 署名の配布物は Gatekeeper に隔離されるため、解除手順を dmg に同梱する。
  # Release の説明文にも同じ案内があるが、dmg を直接受け取った人には届かない。
  # contents を指定すると既定のレイアウトを上書きするので、アプリと
  # /Applications へのリンクも既定と同じ座標で並べ直す必要がある。
  # 既定の背景画像は 540x380 固定でウィンドウを広げると破綻するため、
  # サイズは変えず、矢印の下の空き領域にテキストを置いている。
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
    # 日本語と英語の案内を並べる。どちらの言語の人も最初に目に入るように。
    - x: 180
      y: 335
      type: file
      path: build/dmg/はじめにお読みください.txt
    - x: 360
      y: 335
      type: file
      path: build/dmg/READ ME FIRST.txt

# Windows 版（ADR-048）。最初の版は x64 のみ・署名なし。アイコンは build/icon.png から作らせる。
win:
  target:
    - target: nsis
      arch: [x64]
  # whisper-cli（Vulkan 版）と補助プログラムの exe、それらが読む dll。
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - '*.exe'
        - '*.dll'

nsis:
  # 管理者権限を求めず、利用者ごとに入れる。インストール先を選ばせ、スタートメニューに置く。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
